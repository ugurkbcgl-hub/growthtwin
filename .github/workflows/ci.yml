name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growthtwin_ci -d growthtwin_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off

      - name: Build and verify Python distributions
        run: |
          python -m build --sdist --wheel
          python scripts/verify_build_artifacts.py

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py check

      - name: Check migrations are up to date
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py makemigrations --check --dry-run

      - name: Run Django tests
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
          POSTGRES_PASSWORD: growthtwin-ci-only-placeholder-not-for-deployment
          POSTGRES_HOST: 127.0.0.1
        run: python manage.py test
