name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  django-check:
    name: Django system check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install application and development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Check Python formatting
        run: python -m ruff format --check .

      - name: Lint Python
        run: python -m ruff check .

      - name: Audit installed Python dependencies
        run: python -m pip_audit --local --skip-editable --progress-spinner off

      - name: Run Django system check
        env:
          DJANGO_SECRET_KEY: ci-only-placeholder-not-for-deployment
          POSTGRES_DB: growthtwin_ci
          POSTGRES_USER: growthtwin_ci
        run: python manage.py check
