[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthtwin-web"
version = "0.1.0"
description = "Phase 0 Django application foundation for GrowthTwin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[project.optional-dependencies]
dev = [
    "build==1.6.1",
    "pip-audit==2.10.1",
    "ruff==0.16.9",
]

[tool.ruff]
target-version = "py313"
line-length = 88
extend-exclude = ["build/**", "dist/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "growthtwin*"]
