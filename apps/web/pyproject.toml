[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "growthtwin-web"
version = "0.1.0"
description = "Phase 0 Django application foundation for GrowthTwin"
requires-python = ">=3.13,<3.14"
dependencies = [
    "Django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["config*", "growthtwin*"]
